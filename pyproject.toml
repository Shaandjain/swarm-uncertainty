[project]
name = "swarm-uncertainty"
version = "0.1.0"
description = "Uncertainty and intervention in orchestrated LLM agent teams, evaluated on tau-bench"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyyaml>=6",
    "tau2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_uncertainty"]

[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "v1.0.1" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
