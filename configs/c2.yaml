# single agent, self-consistency over 5 samples, escalates at the threshold.
name: c2
domain: retail
split: train
k_workers: 1
n_samples: 5
threshold: 0.4
escalate: true
oracle: gold_veto
orchestrator_model: ORCHESTRATOR_MODEL
worker_models:
  - WORKER_MODEL
user_model: USER_MODEL
temperature: 1.0
trials: 4
max_escalations_per_task: 3
spend_cap_usd: 0
seed: 0
