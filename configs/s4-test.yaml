# s4: ten samples at the plan; when they disagree (U >= threshold) the agent asks the customer
# one question instead of proposing. Run with --threshold from calibrate.py --budget on train.
name: s4-test
domain: retail
split: test
k_workers: 1
n_samples: 10
threshold: 0.4
escalate: false
oracle: none
plan_probe: true
plan_ask: true
orchestrator_model: claude-haiku-5-5
worker_models:
  - claude-haiku-5-5
user_model: gpt-4.1-2025-04-14
temperature: 1.0
trials: 2
max_escalations_per_task: 3
spend_cap_usd: 20
seed: 0
