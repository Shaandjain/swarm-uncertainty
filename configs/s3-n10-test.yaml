# s3-n10 on the held-out test split, to check a threshold fitted on train.
name: s3-n10-test
domain: retail
split: test
k_workers: 1
n_samples: 10
threshold: 0.4
escalate: false
oracle: none
plan_probe: true
orchestrator_model: claude-haiku-5-5
worker_models:
  - claude-haiku-5-5
user_model: gpt-4.1-2025-04-14
temperature: 1.0
trials: 2
max_escalations_per_task: 3
spend_cap_usd: 20
seed: 0
